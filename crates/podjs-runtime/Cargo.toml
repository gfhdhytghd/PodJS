[package]
name = "podjs-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
memory-diagnostics = ["pocket-mod/memory-diagnostics"]

[dependencies]
flate2 = "1"
anyhow.workspace = true
base64 = "0.22"
log.workspace = true
regex = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10.9"
hmac = "0.12.1"
libc = "0.2"
pocket-mod.workspace = true
pocket-ui-surface.workspace = true
pocket-fs.workspace = true
pocketjs-core.workspace = true
pocket-net = { path = "../../vendor/pocketjs/engine/crates/pocket-net" }
# Android targets are not among rquickjs-sys' pre-generated binding set.
# Enabling bindgen here unifies the feature for PocketJS' rquickjs instance.
rquickjs = { version = "0.12", features = ["bindgen"] }
