[workspace]
resolver = "2"
members = ["crates/podjs-runtime"]
exclude = ["vendor/pocketjs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gfhdhytghd/PodJS"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pocket-mod = { path = "vendor/pocketjs/engine/crates/pocket-mod" }
pocket-ui-surface = { path = "vendor/pocketjs/engine/crates/pocket-ui-surface" }
pocket-fs = { path = "vendor/pocketjs/engine/crates/pocket-fs" }
pocketjs-core = { path = "vendor/pocketjs/engine/core", features = ["std"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Bounded, allocation-free QuickJS interrupt stack reader (see its PATCH.md).
[patch.crates-io]
rquickjs-sys = { path = "vendor/pocketjs/engine/vendor/rquickjs-sys" }
